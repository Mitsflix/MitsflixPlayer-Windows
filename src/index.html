<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src * data: blob:; media-src * data: blob:; connect-src *; worker-src 'self' blob:; font-src 'self' data:">
  <title>Mitsflix Player</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="titlebar">
    <img class="titlebar-logo" src="assets/wordmark.png" alt="Mitsflix">
    <div class="titlebar-space"></div>
    <div id="playlist-pill" class="pill" hidden></div>
  </header>

  <div class="shell">
    <nav class="rail" id="rail">
      <button class="rail-btn" data-view="home" title="Home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></button>
      <button class="rail-btn" data-view="search" title="Search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><span>Search</span></button>
      <button class="rail-btn" data-view="live" title="Live TV"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M8 2l4 4 4-4"/></svg><span>Live TV</span></button>
      <button class="rail-btn" data-view="movies" title="Movies"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/></svg><span>Movies</span></button>
      <button class="rail-btn" data-view="series" title="Series"><svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M6 5h12M8 2h8"/></svg><span>Series</span></button>
      <button class="rail-btn" data-view="favourites" title="Favourites"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-9.2-9A5 5 0 0 1 12 6a5 5 0 0 1 9.2 5C19 15.6 12 20 12 20z"/></svg><span>Favourites</span></button>
      <div class="rail-space"></div>
      <button class="rail-btn" data-view="settings" title="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>Settings</span></button>
    </nav>
    <main id="view" class="view"></main>
  </div>

  <div id="player" class="player" hidden></div>
  <div id="modal-root"></div>
  <div id="toast" class="toast" hidden></div>

  <script src="../node_modules/hls.js/dist/hls.min.js"></script>
  <script src="../node_modules/mpegts.js/dist/mpegts.js"></script>
  <script src="app.js"></script>
</body>
</html>
