name: Build apps

# Every push builds the Windows installer and the Linux packages. When package.json has a version
# that isn't released yet (no v<version> tag), they are published together as one GitHub release,
# and installed copies update themselves from it. Mitsflix Bot announces it in Discord.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: windows-latest, flag: --win, name: windows }
          - { os: ubuntu-22.04, flag: --linux, name: linux }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build
        run: npx electron-builder ${{ matrix.flag }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: What was built
        shell: bash
        run: ls -la dist

      # The packages plus the files installed copies read to find updates (latest.yml, latest-linux.yml).
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/MitsflixPlayer-Setup.exe
            dist/MitsflixPlayer-Setup.exe.blockmap
            dist/MitsflixPlayer.AppImage
            dist/MitsflixPlayer.deb
            dist/latest*.yml
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish this version if it's new
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          ls -la out
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION is already released: built only."
            exit 0
          fi
          for f in MitsflixPlayer-Setup.exe MitsflixPlayer-Setup.exe.blockmap latest.yml MitsflixPlayer.AppImage MitsflixPlayer.deb latest-linux.yml; do
            [ -f "out/$f" ] || { echo "Missing $f: not releasing."; exit 1; }
          done
          gh release create "v$VERSION" out/* \
            --target "$GITHUB_SHA" --title "Mitsflix Player $VERSION for Windows and Linux" \
            --notes "$( [ -f "notes/v$VERSION.md" ] && cat "notes/v$VERSION.md" )"
